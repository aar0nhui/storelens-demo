# Runs the tests and checks that the static site still builds. Free on public repositories.
# Deployment is NOT done here: Cloudflare watches the repo and publishes ./site on every push to main.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: private-app Worker (tests, and a deploy dry run that needs no Cloudflare login)
        working-directory: cloud
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir .dryrun
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m "not slow"
      - run: storelens site --config demo_data/store.yaml --db demo_data/demo.db --out /tmp/site-check
      - run: storelens site --private --out /tmp/private-check
